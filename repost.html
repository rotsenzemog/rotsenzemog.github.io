<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.4</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 🧵 ¿Hasta dónde llegarías por cerrar el pasado? Tamara desciende a las profundidades de la Sima, pero su mente viaja al Monte Roraima y a un antiguo amor. Comienza el Capítulo 1.4 de #EnigmaEnLaSima.

2/3 Entre cuerdas y abismos, Arturo, su esposo, la observa. Sabe que la sombra de Iván Marcano, líder de la expedición desaparecida, sigue presente entre las rocas y en la mirada de Tamara. 🧗‍♀️💔

3/3 ¿Es este viaje un rescate o la necesidad urgente de una despedida definitiva? La montaña guarda secretos y el alma humana abismos aún más profundos. ¡Lee el capítulo hoy! 🏔️✨</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">Descender a las entrañas de la tierra no solo exige fuerza física... también exige enfrentar los fantasmas del pasado. 🧗‍♀️

En el Capítulo 1.4 de 'Enigma en la Sima', acompañamos a Tamara en un vertiginoso descenso a través del abismo. Mientras la fatiga y la superficie rugosa del risco ponen a prueba la resistencia del equipo, el verdadero conflicto se libra en su interior.

A su lado desciende Arturo, su esposo, quien nota que la mirada de Tamara dice algo muy distinto a sus palabras: la sombra de Iván Marcano —su expareja y líder de la trágica expedición anterior— sigue estando presente. ¿Es esta travesía una expedición de rescate o la única forma de cerrar una herida que no deja de sangrar?

Un capítulo cargado de adrenalina, nostalgia y profunda tensión psicológica.

👇 Lee la entrega completa aquí y déjanos tus impresiones en los comentarios.</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Asunto: El abismo por dentro y por fuera 🏔️

Hola a todos,

En esta nueva entrega de 'Enigma en la Sima' (Capítulo 1.4), la expedición continúa su agotador descenso a través del farallón. Pero más allá de la exigencia física y del peligro inminente de la pared de roca, la historia se adentra en el territorio más complejo de todos: la memoria y el remordimiento.

Tamara avanza en piloto automático mientras revive los recuerdos de su vida con Iván Marcano, el líder desaparecido de la expedición anterior. A pocos metros, su actual esposo, Arturo, contempla el dolor silencioso de Tamara y confía en que esta misión traiga finalmente el cierre que ambos necesitan para sanar.

La Sima engulle a quienes se atreven a perturbar su calma, revelando que el abismo más profundo no siempre está en la tierra, sino en el corazón humano.

👉 [Haz clic aquí para leer el Capítulo 1.4 completo]

¡Gracias por acompañarnos en esta aventura!</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
