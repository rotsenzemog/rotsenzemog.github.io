<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.4</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 Un descenso al abismo que es también un viaje al pasado. En el Capítulo 1.4 de 'Enigma en la Sima', Tamara se enfrenta a las profundidades de la grieta y a los fantasmas de su memoria. 🧵👇

2/3 Mientras rapela exhausta, los recuerdos de Iván Marcano —su expareja y líder de la expedición perdida— la persiguen. A su lado desciende Arturo, su esposo, consciente de la tormenta interna de ella.

3/3 ¿Es esta expedición un rescate o la búsqueda de un cierre definitivo? El cansancio aprieta y las emociones afloran en la oscuridad. ¡Lee el capítulo completo!</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">🧗‍♀️ El abismo físico no es nada comparado con las grietas del corazón.

En el Capítulo 1.4 de 'Enigma en la Sima', acompañamos a Tamara en un agotador descenso en rápel. Entre cuerdas, sudor y rocas erosionadas por milenios, la verdadera tensión surge de las sombras del pasado: la imperiosa necesidad de hallar los restos de Iván Marcano y la silenciosa mirada de Arturo, su actual esposo.

Detrás de su faceta pública de aventurera intrépida, Tamara lucha contra la culpa y la depresión. ¿Servirá esta arriesgada expedición para cerrar sus heridas o terminará por consumirla?

👉 Lee la nueva entrega y déjanos tu opinión en los comentarios. #EnigmaEnLaSima #Literatura #Aventura #Suspenso</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Boletín Semanal: Descendiendo a las sombras del pasado

Hola a todos,

En el Capítulo 1.4 de 'Enigma en la Sima', la narrativa alcanza un punto de alta tensión emocional y física. Mientras la escuadra se aproxima exhausta a un saliente a mitad del abismo, Tamara se debate entre el cansancio extremo y los recuerdos inconclusos de Iván Marcano, el hombre que le rompió el corazón y cuya expedición desapareció sin dejar rastro.

A su lado, Arturo la observa en silencio, esperando que esta travesía signifique finalmente el punto final que su matrimonio necesita. 

Un capítulo imprescindible sobre las fachadas que mostramos al mundo y los abismos reales que llevamos por dentro.

¡Haz clic aquí para leer la entrega completa y participar en el debate!</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
