<header class="site-header">
  <!-- 1. FRANJA TOP PRINCIPAL -->
  <div class="header-top">
    <div class="container header-top-content">
      <a href="{{ '/' | relative_url }}" class="site-branding">
        <img src="{{ '/assets/images/logo-rotsen.svg' | relative_url }}" alt="Rotsen Zemog Logo" class="header-logo-top">
        <span class="site-title">ROTSEN ZEMOG</span>
      </a>
    </div>
  </div>

  <!-- 2. SUBBARRA DE MENÚ INFERIOR -->
  <nav class="header-nav-bar" id="sticky-nav">
    <div class="container nav-bar-content">
      
      <!-- Logo pequeño (scroll/móvil) -->
      <a href="{{ '/' | relative_url }}" class="sticky-logo-link" aria-label="Inicio">
        <img src="{{ '/assets/images/logo-rotsen.svg' | relative_url }}" alt="Rotsen Zemog" class="header-logo-sticky">
      </a>

      <!-- Botón Hamburguesa Móvil -->
      <button class="mobile-menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Menú de Navegación -->
      <ul class="nav-menu" id="navMenu">
        <li><a href="{{ '/yo/' | relative_url }}">Yo</a></li>
        <li><a href="{{ '/mis-obras/' | relative_url }}">Mis obras</a></li>
        <li><a href="{{ '/lore/' | relative_url }}">Lore</a></li>
        <li><a href="{{ '/bitacora/' | relative_url }}">Bitácora</a></li>
        <li class="has-dropdown">
          <a href="#" id="dropdownToggle">Reseñas <span class="arrow-down">▾</span></a>
          <ul class="dropdown-menu">
            <li><a href="{{ '/reseñas/libros/' | relative_url }}">Libros</a></li>
            <li><a href="{{ '/reseñas/series/' | relative_url }}">Series</a></li>
            <li><a href="{{ '/reseñas/peliculas/' | relative_url }}">Películas</a></li>
          </ul>
        </li>
        <li><a href="{{ '/nexo/' | relative_url }}">Nexo</a></li>
      </ul>

    </div>
  </nav>
</header>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    const dropdownToggle = document.getElementById('dropdownToggle');

    if (menuToggle && navMenu) {
      menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });
    }

    if (dropdownToggle) {
      dropdownToggle.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
          e.preventDefault();
          dropdownToggle.parentElement.classList.toggle('open');
        }
      });
    }
  });
</script>
