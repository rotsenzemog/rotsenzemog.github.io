<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.4</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 🧗‍♀️ Descender al abismo no es solo un reto físico... para Tamara, es enfrentarse a los fantasmas del pasado. Mientras se desliza hacia las entrañas de la sima, los recuerdos de Iván Marcano vuelven a emerger.

2/3 💔 Detrás de la adrenalina y su matrimonio con Arturo, las cenizas del ayer siguen ardientes. Tamara busca los restos de su antiguo amor para despedirse definitivamente, mientras Arturo nota la tormenta en su mirada.

3/3 💥 Con el cansancio al límite y la tensión emocional a flor de piel, el equipo se aproxima al primer descanso en el abismo. 📖 Lee ya 'Enigma en la Sima — Capítulo 1.4'.</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">¿Se puede huir del pasado cuando cuelgas de una cuerda a cientos de metros de altura? 🧗‍♀️

En el Capítulo 1.4 de 'Enigma en la Sima', la expedición se adentra en el abismo físico y emocional. Mientras el equipo lucha contra las extenuantes condiciones del descenso, Tamara combate sus propios demonios:

🔹 El recuerdo ardiente de Iván Marcano, su expareja y líder de la fallida expedición anterior.
🔹 El matrimonio con Arturo, quien busca brindarle una nueva vida mientras percibe las sombras que aún la persiguen.
🔹 La imperiosa necesidad de encontrar respuestas para lograr el cierre definitivo.

Entre la tensión competitiva, el sudor y la inmensidad de la sima, los límites de los expedicionarios se ponen a prueba.

👉 Lee el capítulo completo y descubre los secretos que aguardan en la profundidad.

#EnigmaEnLaSima #Literatura #Suspenso #AventuraExtrema #NovedadEditorial</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Asunto: El peso de las cenizas en el fondo del abismo — Cap. 1.4

Hola a todos,

En este nuevo capítulo de 'Enigma en la Sima', el peligro no solo proviene de las paredes rugosas y la profundidad del abismo, sino del terreno emocional de sus protagonistas.

Acompañamos a Tamara en su extenuante descenso en rápel, un recorrido donde cada metro profundiza en los recuerdos no resueltos con Iván Marcano y pone a prueba el compromiso de su esposo, Arturo. Entre la exhaustiva prueba física y las miradas que callan más de lo que dicen, la expedición avanza hacia el primer saliente de la pared.

¿Podrá Tamara encontrar el cierre que busca o la sima devorará sus certezas?

[Haz clic aquí para leer el Capítulo 1.4]</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
