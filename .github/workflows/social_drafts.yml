name: Generar Borradores de Redes Sociales con IA

on:
  push:
    paths:
      - '_posts/**'
  workflow_dispatch:

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai python-frontmatter requests

      - name: Ejecutar script de generación de copys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: "https://rotsenzemog.github.io/repost.html"
          PANEL_SECRET_PIN: "tu_clave_secreta" # Cambia esto por tu PIN personal
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/social_generator.py

      - name: Guardar cambios del Panel Web en el Repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repost.html || true
          git commit -m "Update repost.html [skip ci]" || true
          git push
