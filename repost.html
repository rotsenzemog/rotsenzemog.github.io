<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.2</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 Dos años después de la trágica desaparición de cuatro investigadores, la Misión Cúspide se adentra en el colosal abismo Humboldt. ¿Encontrarán respuestas o el mismo destino? 🧵👇

2/3 Arián lidera a la vanguardia junto a Xamara, el biólogo Edgar Páez y el teniente Rivero. Equipados con tecnología biométrica y trajes termorreguladores, se deslizan hacia 'el ombligo del mundo'.

3/3 Mientras la tensión se disfraza de humor en la superficie, la primera cuadrilla avanza hacia la oscuridad. Descubre qué les depara la sima en el Cap. 1.2 de 'Enigma en la Sima'. 🔗</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">🌲 Misión Cúspide: El descenso al ombligo del mundo 🌲

El inmenso abismo Humboldt vuelve a abrir sus fauces. Dos años después de que una expedición de cuatro investigadores desapareciera sin dejar rastro, un nuevo grupo de exploradores se aventura en las profundidades en busca de respuestas.

Divididos en dos equipos para reducir riesgos, la vanguardia —liderada por Arián, junto a Xamara, el biólogo Edgar Páez y el teniente Leonel Rivero— inicia el arriesgado descenso en rapel. Desafiando la gravedad con destreza y apoyados por trajes termorreguladores y monitoreo biométrico, se adentran en lo desconocido.

Mientras en la superficie la tensión se disfraza con bromas entre el resto del equipo, una pregunta queda flotando en el aire: ¿lograrán regresar sanos y salvos?

📖 Lee el Capítulo 1.2 de 'Enigma en la Sima' y acompáñanos en este viaje al corazón de la tierra.

#EnigmaEnLaSima #CienciaFiccion #Aventura #LecturaRecomendada #Misterio</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Boletín Enigma en la Sima — Capítulo 1.2: El descenso comienza

Estimados lectores,

La Misión Cúspide finalmente ha dado el primer paso hacia el abismo Humboldt, una gigantesca cavidad marcada por la trágica desaparición de una expedición hace dos años.

En este entrega, acompañamos a la vanguardia liderada por Arián en su arriesgado descenso en rapel hacia 'el ombligo del mundo'. Entre el banter de los miembros en la superficie para calmar los nervios, el despliegue de tecnología de punta y la inmensidad del precipicio, la aventura apenas comienza.

👉 Lee el Capítulo 1.2 completo aquí y sumérgete en las profundidades de la historia.</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
