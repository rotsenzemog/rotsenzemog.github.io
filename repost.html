<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.2</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">🧵 1/3 La Sima Humboldt esconde un secreto trágico: hace 2 años, cuatro científicos entraron y jamás regresaron. Hoy, la Misión Cúspide vuelve a las profundidades en busca de respuestas. 👇

2/3 Encabezados por Arián, la vanguardia inicia un peligroso descenso en rapel. Equipados con trajes termorreguladores, monitoreo biométrico y drones vigilantes, se adentran en 'el ombligo del mundo'.

3/3 Entre la tensión del abismo y las bromas del equipo en superficie, la aventura apenas comienza. ¿Lograrán descifrar el enigma? 📖 Lee el Capítulo 1.2 de 'Enigma en la Sima'.</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">🚨 NUEVO CAPÍTULO: Enigma en la Sima — Capítulo 1.2 🚨

El inmenso abismo de la Sima Humboldt vuelve a abrir sus fauces. Dos años después de la trágica desaparición de cuatro investigadores, la Misión Cúspide inicia el descenso a las profundidades en busca de respuestas.

Encabezados por Arián y seguidos por un equipo de elite —biólogos, militares y exploradores armados con tecnología de punta—, la vanguardia da el primer paso hacia 'el ombligo del mundo'. Mientras tanto, en la superficie, el resto de la tripulación intenta calmar los nervios entre sarcasmo, drones y la sombra de lo desconocido.

¿Se puede sobrevivir a la sima únicamente con valor y tecnología?

👉 No te pierdas esta intensa entrega. ¡Lee el capítulo completo aquí y únete a la expedición!</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Boletín de Lanzamiento: Descendiendo al 'Ombligo del Mundo'

Hola a todos los exploradores y lectores,

En esta entrega de 'Enigma en la Sima' (Capítulo 1.2), la Misión Cúspide finalmente da el salto al abismo de la Sima Humboldt. La sombra de la fallida expedición de hace dos años pesa sobre el equipo, pero la tecnología, la disciplina y un indispensable toque de humor entre los personajes marcan el inicio del descenso.

Acompaña a Arián, Xamara, Edgar Páez y al teniente Rivero mientras se adentran en la pendiente, monitoreados por trajes de alta tecnología e intercomunicadores, mientras el grupo en superficie vigila cada uno de sus pasos.

¿Qué encontrarán al fondo de la cavidad?

Haz clic aquí para leer el capítulo completo y no olvides dejar tus teorías en los comentarios.</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
