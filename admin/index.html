<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <!-- Script de Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      // Detectar si estamos en el dominio de Netlify
      const isNetlify = window.location.hostname.includes("netlify.app");

      if (isNetlify) {
        // EN NETLIFY: Cargar el CMS normalmente
        document.write('<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"><\/script>');
        
        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("init", user => {
            if (!user) {
              window.netlifyIdentity.on("login", () => {
                document.location.reload();
              });
            }
          });
        }
      } else {
        // EN GITHUB PAGES: Mostrar la tarjeta de acceso
        document.write(`
          <style>
            body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #fff; }
            .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; text-align: center; max-width: 400px; border: 1px solid #334155; }
            h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 1rem; }
            p { color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
            .btn { display: block; width: 100%; padding: 0.75rem; border-radius: 6px; text-decoration: none; font-weight: 600; box-sizing: border-box; margin-bottom: 0.75rem; }
            .btn-primary { background: #0284c7; color: #fff; }
            .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid #475569; }
          </style>
          <div class="card">
            <h1>Panel de Administración</h1>
            <p>Accede al panel desde la app de autenticación segura.</p>
            <a href="https://marvelous-meringue-028d74.netlify.app/admin/" target="_blank" onclick="setTimeout(() => window.location.href='https://rotsenzemog.github.io', 500)" class="btn btn-primary">
              Abrir Decap CMS ↗
            </a>
            <a href="https://rotsenzemog.github.io" class="btn btn-secondary">
              Volver a la Web Principal
            </a>
          </div>
        `);
      }
    </script>
  </body>
</html>
