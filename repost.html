<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.2</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 🕳️ El impresionante Abismo Humboldt guarda un oscuro secreto: hace dos años, cuatro científicos entraron y jamás salieron. Hoy, una nueva expedición desciende en busca de respuestas. ¿Lograrán regresar con vida? #EnigmaEnLaSima

2/3 🧗‍♂️ Arián da el primer paso encabezando la vanguardia junto a Xamara, el biólogo Edgar Páez y el teniente Rivero. Equipados con ropa termorreguladora y tecnología biométrica, se adentran en 'el ombligo del mundo'.

3/3 📡 Mientras arriba el resto del equipo intenta disipar la tensión con humor, abajo el precipicio los espera. No te pierdas el Capítulo 1.2 de esta apasionante historia de aventura y ciencia ficción. 📖✨</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">🕳️ ¡EL DESCENSO HA COMENZADO! | Enigma en la Sima — Capítulo 1.2 🧗‍♂️✨

El temible Abismo Humboldt vuelve a abrir sus puertas. Dos años después de la trágica desaparición de cuatro investigadores, la 'Misión Cúspide' se enfrenta al reto de adentrarse en las profundidades del precipicio para descubrir la verdad.

Para reducir riesgos, el equipo decide dividirse. El líder Arián da el primer paso hacia 'el ombligo del mundo', seguido por Xamara, el biólogo Edgar Páez y el teniente Leonel Rivero. Con una agilidad propia de jaguares y protegidos por trajes termorreguladores y monitoreo biométrico de última generación, la primera cuadrilla se desliza hacia lo desconocido.

Mientras en la superficie la tensión se camufla entre bromas y comentarios sarcásticos, abajo las mandíbulas de la sima aguardan...

¿Qué encontrarán en la penumbra del abismo? ¿Lograrán romper la maldición de la expedición anterior?

👉 Lee el capítulo completo y déjanos tus teorías en los comentarios. 👇

#EnigmaEnLaSima #CienciaFiccion #Aventura #Literatura #LecturaRecomendada</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Asunto: Descendiendo al 'ombligo del mundo' 🕳️

Estimados lectores,

En esta nueva entrega de 'Enigma en la Sima' (Capítulo 1.2), nos situamos al borde del abrumador Abismo Humboldt. La sombra de la tragedia de hace dos años —donde cuatro investigadores desaparecieron sin dejar rastro— planea sobre nuestros protagonistas, pero la búsqueda de respuestas es más fuerte que el miedo.

Acompaña a Arián, Xamara, Edgar Páez y al teniente Rivero en los primeros metros de un peligroso descenso a rapel. Una combinación fascinante de destreza física clásica y tecnología de vanguardia (monitoreo biométrico, prendas termorreguladoras y realidad aumentada) se pone a prueba mientras el grupo de la superficie observa con cautela y humor defensivo.

La misión apenas comienza, pero el abismo ya reclama su atención.

[Haz clic aquí para leer el Capítulo 1.2 completo]

¡Gracias por leer y ser parte de esta expedición!</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
