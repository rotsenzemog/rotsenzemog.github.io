---
layout: default
---
<article style="max-width: 750px; margin: 40px auto;">
  <span class="category-tag">{{ page.category }}</span>
  <h1 style="font-family: var(--font-serif); font-size: 2.8rem; margin: 10px 0;">{{ page.title }}</h1>
  <p style="color: var(--muted-text); margin-bottom: 30px;">Escrito {{ page.date | date: "%d/%m/%Y" }} por {{ site.author.name }}</p>
  
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="width:100%; border-radius:8px; margin-bottom:30px;">
  {% endif %}

  <div class="post-content" style="font-size: 1.1rem; line-height: 1.8;">
    {{ content }}
  </div>
  
  <!-- Sección de Comentarios Disqus -->
{% if page.comments != false %}
  <section class="post-comments" style="margin-top: 50px; padding-top: 30px; border-top: 1px solid #e2e8f0;">
    <div id="disqus_thread"></div>
    <script>
        var disqus_config = function () {
            this.page.url = '{{ page.url | absolute_url }}';
            this.page.identifier = '{{ page.id }}';
        };
        (function() {
            var d = document, s = d.createElement('script');
            s.src = 'https://rotsenzemog-com.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Por favor habilita JavaScript para ver los <a href="https://disqus.com/?ref_noscript">comentarios cargados por Disqus.</a></noscript>
  </section>
{% endif %}
</article>
