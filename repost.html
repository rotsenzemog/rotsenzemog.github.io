<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.4</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">🧵 (1/3) ¿Puedes escapar del pasado mientras desciendes al abismo?

En el Cap. 1.4 de 'Enigma en la Sima', Tamara se enfrenta a algo más peligroso que la pared del farallón: sus propios recuerdos en pleno descenso.

(2/3) Su misión es rescatar los restos de Iván Marcano, su ex y líder de la expedición perdida. Pero a su lado desciende Arturo, su esposo actual, quien nota que las cenizas del ayer siguen ardiendo.

(3/3) Entre el sudor, la fatiga extrema y secretos no resueltos, la tensión escala a metros de profundidad. ¿Cierre definitivo o colapso emocional? 📖 Descubre el capítulo completo.</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">🧗‍♀️ Descender a las entrañas de la tierra ya es una hazaña extrema, pero hacerlo cargando con los fantasmas del pasado lo cambia todo.

En el Capítulo 1.4 de 'Enigma en la Sima', la tensión física del rápel se mezcla con un dilema emocional devastador. Tamara avanza hacia la profundidad del abismo con el cuerpo en piloto automático, mientras su mente revive los recuerdos de Iván Marcano, el líder de la expedición anterior y su antiguo amor.

A poca distancia, Arturo —su esposo actual— observa la mirada de Tamara y sabe que su actitud optimista es solo una fachada. Las cenizas del pasado aún queman, y esta misión no es solo un rescate: es la búsqueda desesperada de un cierre definitivo.

🔥 Un capítulo donde la adrenalina, la psicología de los personajes y el misterio se cruzan en el vacío.

👇 ¿Logrará Tamara pasar página o el abismo revelará viejas heridas? Lee el capítulo completo y déjanos tu opinión.</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Capítulo 1.4: Fantasmas en la pared del abismo

Estimados lectores,

En esta nueva entrega de 'Enigma en la Sima', la exigencia física del descenso a la profundidad solo es superada por la tormenta silenciosa que viven sus protagonistas.

Mientras el equipo avanza hacia el saliente a mitad del abismo, Tamara lucha internamente contra los recuerdos de su antigua pareja, Iván Marcano, bajo la mirada atenta de Arturo, su esposo. Entre el cansancio extremo y las emociones a flor de piel, la expedición se convierte en una prueba de fuego emocional sobre el vacío.

¿Es posible cerrar un ciclo sentimental mientras te juegas la vida colgado de una cuerda?

Lee el capítulo completo y acompaña a la escuadra en este tenso descenso.</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
