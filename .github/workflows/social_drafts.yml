name: Generar Borradores de Redes Sociales con IA

on:
  push:
    paths:
      - '_posts/**'

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías requeridas
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai python-frontmatter requests

      - name: Ejecutar script de generación de copys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/social_generator.py
