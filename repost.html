<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.4</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 🧗‍♀️ ¿Se puede huir del pasado mientras te sumerges en el abismo? Tamara desciende en rápel, pero su mente viaja al Monte Roraima y al recuerdo de Iván Marcano, el líder desaparecido de la expedición anterior. #EnigmaEnLaSima

2/3 💥 La fatiga es extrema y la tensión con su esposo Arturo es palpable. Él sabe que la actitud competitiva de Tamara oculta grietas profundas y un amor del pasado que aún arde en cenizas.

3/3 👁️‍🗨️ ¿Será este viaje el cierre definitivo que ella necesita o el abismo devorará su relación? Descubre el Capítulo 1.4 de «Enigma en la Sima». ⬇️</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">¿Hasta dónde llegarías para cerrar definitivamente una herida del pasado?

En el Capítulo 1.4 de «Enigma en la Sima», el descenso hacia lo profundo de la tierra no es solo un reto físico extremo, sino una prueba psicológica implacable. Mientras Tamara se desliza en rápel por la pared del farallón, los recuerdos de Iván Marcano —su antigua pareja y líder de la expedición perdida— la persiguen entre la brisa.

A su lado desciende Arturo, su actual esposo, quien ha dedicado su vida a apoyarla pero no puede ignorar la verdad: detrás de la imagen pública de aventurera invencible, Tamara aún lucha contra sus propios fantasmas. Esta expedición es su única oportunidad para rescatar sus restos y decirle adiós para siempre... si la sima se lo permite.

💬 ¿Crees que es posible construir un futuro sólido cuando el pasado aún no se ha cerrado?

👉 Lee el capítulo completo y sumérgete en el misterio.</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Boletín: Fantasmas sobre el vacío — Capítulo 1.4

Hola a todos,

A veces, los abismos más profundos no están esculpidos en la roca, sino en la memoria. En el Capítulo 1.4 de «Enigma en la Sima», la expedición continúa su extenuante descenso en rápel, pero la verdadera carga de los protagonistas no es el equipo de montaña, sino lo que llevan dentro.

Entre flashbacks del Monte Roraima y la omnipresente sombra de Iván Marcano, acompañamos a Tamara en una búsqueda que es tanto física como emocional. Mientras tanto, Arturo la observa en silencio, esperando que esta travesía extenuante sea el final de los episodios oscuros de su esposa y el verdadero inicio de su vida juntos.

Un capítulo impregnado de tensión silenciosa, agotamiento físico y la promesa de secretos a punto de salir a la luz.

[Lee el Capítulo 1.4 aquí]

¡Gracias por leer y formar parte de esta aventura!</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
