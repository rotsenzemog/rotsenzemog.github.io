<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Social - Repost</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.5rem; }
        h2 { color: #f1f5f9; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; text-decoration: none; display: inline-block; }
        .btn-green { background: #22c55e; }
        #protected-content { display: none; }
        #login-box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; border: 1px solid #334155; }
        input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; width: 200px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-box">
        🔒 <h2>Acceso Restringido</h2>
        <p>Introduce tu PIN para acceder al panel:</p>
        <input type="password" id="pinInput" placeholder="PIN Secreto">
        <br><br>
        <button class="btn" onclick="verifyPin()">Entrar</button>
    </div>

    <div id="protected-content">
        <h1>🚀 Panel Social: Enigma en la Sima — Capítulo 1.2</h1>
        
        <div class="card">
            <h2>🧵 Hilo para X (Twitter)</h2>
            <textarea id="tw">1/3 🕳️ El abismo Humboldt no perdona. Dos años después de que cuatro investigadores desaparecieran en sus profundidades, una nueva expedición intenta descender en busca de respuestas. ¡La Misión Cúspide ha comenzado! 🧵👇

2/3 🧗‍♂️ Arián, Xamara, Edgar y el teniente Rivero lideran la vanguardia, descendiendo en rapel a la vieja usanza por las paredes del precipicio. En la superficie, el resto del equipo intenta calmar la tensión con humor y sarcasmo.

3/3 📡 Trajes termorreguladores, pulseras biométricas y drones los vigilan, pero la inmensidad del 'ombligo del mundo' los hace parecer diminutos. ¿Regresarán con vida? Descubre el Capítulo 1.2 de #EnigmaEnLaSima 📖</textarea>
            <button class="btn" onclick="copyToClipboard('tw')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://twitter.com/intent/tweet" target="_blank">🐤 Abrir X</a>
        </div>

        <div class="card">
            <h2>📘 Post para Facebook / LinkedIn</h2>
            <textarea id="fb">🌿 ¿Te atreverías a descender al 'ombligo del mundo'?

En el Capítulo 1.2 de «Enigma en la Sima», la Misión Cúspide establece su base logística al borde de la colosal Sima Humboldt. Hace dos años, cuatro científicos entraron en este abismo y jamás regresaron. Hoy, una nueva cuadrilla de exploradores altamente capacitados inicia el descenso en busca de la verdad.

Encabezados por Arián, el primer grupo se desliza por las paredes de la sima con la agilidad de jaguares. Equipados con trajes termorreguladores, sensores biométricos y realidad aumentada, enfrentan la inmensidad del abismo mientras en la superficie el resto del equipo observa entre bromas, drones y nerviosismo.

La destreza humana y la tecnología más avanzada se miden contra lo desconocido. ¿Lograrán descubrir qué pasó con la expedición anterior o el abismo se los tragará también?

👉 Lee el Capítulo 1.2 completo y déjanos tus teorías en los comentarios. #CienciaFicción #Aventura #EnigmaEnLaSima #Lectores</textarea>
            <button class="btn" onclick="copyToClipboard('fb')">📋 Copiar Texto</button>
            <a class="btn btn-green" href="https://www.facebook.com" target="_blank">📘 Abrir Facebook</a>
        </div>

        <div class="card">
            <h2>✉️ Boletín para Substack</h2>
            <textarea id="sub">Boletín: Capítulo 1.2 — El descenso al ombligo del mundo 🕳️

Hola a todos,

La Misión Cúspide ha llegado a su primer gran desafío. Frente a ellos se abre la inmensidad del abismo Humboldt, el mismo lugar que hace dos años se tragó a una expedición de cuatro científicos sin dejar rastro.

En esta entrega, la vanguardia del equipo —Arián, Xamara, Edgar Páez y el teniente Rivero— inicia el arriesgado descenso en rapel. Entre el despliegue de tecnología biométrica, la supervisión de drones voladores y el humor ácido de los compañeros que quedan en la superficie, la tensión se siente en cada metro que bajan.

¿Qué aguarda en las profundidades de la cavidad? Acompaña a nuestros exploradores en este emocionante nuevo episodio.

👉 [Leer el Capítulo 1.2 aquí]</textarea>
            <button class="btn" onclick="copyToClipboard('sub')">📋 Copiar Texto</button>
        </div>
    </div>

    <script>
        const AUTH_PIN = "tu_clave_secreta";

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === AUTH_PIN) {
                localStorage.setItem('repost_auth', AUTH_PIN);
                showContent();
            } else {
                alert("PIN incorrecto");
            }
        }

        function showContent() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('protected-content').style.display = 'block';
        }

        function copyToClipboard(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Copiado al portapapeles!");
        }

        // Comprobar autenticación guardada al cargar
        if (localStorage.getItem('repost_auth') === AUTH_PIN) {
            showContent();
        }
    </script>
</body>
</html>
